<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shift Tracker</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #0c0c14; -webkit-tap-highlight-color: transparent; }
        input[type="time"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .35; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const STORAGE_KEY = "nerf_shifts_v2";

        const GAMES = [
            { id: "nerf", label: "Nerf", emoji: "🔫" },
            { id: "laser", label: "Laser Tag", emoji: "🎯" },
            { id: "firefly", label: "Πυγολαμπίδα", emoji: "✨" },
            { id: "watergun", label: "Water Gun", emoji: "💦" },
            { id: "archery", label: "Τοξοβολία", emoji: "🏹" },
            { id: "bubbles", label: "Bubbles", emoji: "🫧" },
            { id: "other", label: "Άλλο", emoji: "🎮" },
        ];

        const blank = () => ({
            date: new Date().toISOString().slice(0, 10),
            location: "", games: [], workStart: "", workEnd: "",
            hasDriving: false, driveStart: "", driveEnd: "", pay: "", notes: "",
        });

        // Helpers
        const mins = t => { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; };
        const diffH = (a, b) => {
            if (!a || !b) return null;
            const d = mins(b) >= mins(a) ? mins(b) - mins(a) : 1440 - mins(a) + mins(b);
            return +(d / 60).toFixed(2);
        };
        const fmtH = h => {
            if (h == null) return null;
            const hr = Math.floor(h), mn = Math.round((h - hr) * 60);
            return mn > 0 ? `${hr}ω ${mn}λ` : `${hr}ω`;
        };
        const fmtDate = d => {
            if (!d) return "";
            const [y, m, day] = d.split("-");
            const mo = ["Ιαν","Φεβ","Μαρ","Απρ","Μαϊ","Ιουν","Ιουλ","Αυγ","Σεπ","Οκτ","Νοε","Δεκ"];
            return `${parseInt(day)} ${mo[parseInt(m)-1]} ${y}`;
        };

        // UI Components
        const Field = ({ label, children }) => (
            <div style={{ marginBottom: 24 }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: "rgba(255,255,255,0.3)", textTransform: "uppercase", marginBottom: 9 }}>{label}</div>
                {children}
            </div>
        );

        const TxtInput = ({ style, ...props }) => (
            <input {...props} style={{
                width: "100%", background: "rgba(255,255,255,0.05)", border: "0.5px solid rgba(255,255,255,0.1)",
                borderRadius: 14, padding: "14px 16px", color: "#f0f0f5", fontSize: 16, outline: "none", ...style
            }} />
        );

        const TimeBlock = ({ emoji, title, color, bg, border, startVal, endVal, onStart, onEnd, hasDriving, onToggle }) => {
            const dur = fmtH(diffH(startVal, endVal));
            const isDrive = onToggle !== undefined;
            const showPickers = !isDrive || hasDriving;

            return (
                <div style={{ background: bg, border: `0.5px solid ${border}`, borderRadius: 20, padding: "18px", marginBottom: 16 }}>
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: showPickers ? 18 : 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
                            <span style={{ fontSize: 22 }}>{emoji}</span>
                            <span style={{ fontSize: 15, fontWeight: 600, color }}>{title}</span>
                        </div>
                        {isDrive ? (
                            <button onClick={onToggle} style={{ border: "none", background: hasDriving ? `${color}28` : "rgba(255,255,255,0.07)", color: hasDriving ? color : "rgba(255,255,255,0.3)", padding: "6px 16px", borderRadius: 20, fontSize: 13 }}>
                                {hasDriving ? "✓ Ναι" : "Όχι"}
                            </button>
                        ) : dur && <span style={{ fontSize: 12, fontWeight: 600, background: `${color}28`, color, borderRadius: 20, padding: "4px 12px" }}>{dur}</span>}
                    </div>
                    {showPickers && (
                        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                            <div>
                                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.2)", marginBottom: 5 }}>Έναρξη</div>
                                <input type="time" value={startVal} onChange={e => onStart(e.target.value)} style={{ width: "100%", background: "rgba(0,0,0,0.2)", border: `0.5px solid ${border}`, borderRadius: 12, padding: 12, color: "#fff", outline: "none" }} />
                            </div>
                            <div>
                                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.2)", marginBottom: 5 }}>Λήξη</div>
                                <input type="time" value={endVal} onChange={e => onEnd(e.target.value)} style={{ width: "100%", background: "rgba(0,0,0,0.2)", border: `0.5px solid ${border}`, borderRadius: 12, padding: 12, color: "#fff", outline: "none" }} />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [shifts, setShifts] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEY)) || []);
            const [view, setView] = useState("list");
            const [form, setForm] = useState(blank());
            const [selected, setSelected] = useState(null);

            useEffect(() => { localStorage.setItem(STORAGE_KEY, JSON.stringify(shifts)); }, [shifts]);

            const save = () => {
                const workH = diffH(form.workStart, form.workEnd);
                const driveH = form.hasDriving ? diffH(form.driveStart, form.driveEnd) : null;
                const entry = { ...form, id: Date.now(), workH, driveH };
                setShifts([entry, ...shifts]);
                setView("list");
            };

            return (
                <div style={{ fontFamily: "-apple-system, sans-serif", color: "#f0f0f5", maxWidth: 430, margin: "0 auto", paddingBottom: 100 }}>
                    {view === "list" && (
                        <div style={{ padding: 22 }}>
                            <h1 style={{ fontSize: 32, fontWeight: 700, marginTop: 40, marginBottom: 24 }}>Βάρδιες</h1>
                            {shifts.map(s => (
                                <div key={s.id} onClick={() => { setSelected(s); setView("detail"); }} style={{ background: "rgba(255,255,255,0.04)", borderRadius: 20, padding: 18, marginBottom: 12 }}>
                                    <div style={{ display:"flex", justifyContent:"space-between" }}>
                                        <div style={{ fontWeight:600 }}>📍 {s.location}</div>
                                        <div style={{ color: "#7dffb3", fontWeight: 700 }}>€{s.pay}</div>
                                    </div>
                                    <div style={{ fontSize: 12, color: "rgba(255,255,255,0.3)" }}>{fmtDate(s.date)}</div>
                                </div>
                            ))}
                            <button onClick={() => { setForm(blank()); setView("add"); }} style={{ position: "fixed", bottom: 30, right: 24, width: 64, height: 64, borderRadius: 32, background: "#8264ff", color: "#fff", fontSize: 32, border: "none", boxShadow: "0 10px 20px rgba(0,0,0,0.3)" }}>+</button>
                        </div>
                    )}

                    {view === "add" && (
                        <div style={{ padding: 22 }}>
                            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginTop: 40, marginBottom: 30 }}>
                                <button onClick={() => setView("list")} style={{ background: "none", border: "none", color: "#8264ff" }}>← Πίσω</button>
                                <h2 style={{ fontWeight: 700 }}>Νέα Βάρδια</h2>
                                <div style={{ width: 40 }}></div>
                            </div>

                            <Field label="Ημερομηνία"><TxtInput type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} /></Field>
                            <Field label="Τοποθεσία"><TxtInput placeholder="Πού;" value={form.location} onChange={e => setForm({...form, location: e.target.value})} /></Field>
                            
                            <Field label="Παιχνίδια">
                                <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                                    {GAMES.map(g => (
                                        <button key={g.id} onClick={() => {
                                            const gs = form.games.includes(g.id) ? form.games.filter(x => x !== g.id) : [...form.games, g.id];
                                            setForm({...form, games: gs});
                                        }} style={{ padding: "8px 12px", borderRadius: 15, border: "0.5px solid rgba(255,255,255,0.1)", background: form.games.includes(g.id) ? "rgba(130,100,255,0.2)" : "rgba(255,255,255,0.05)", color: "#fff", fontSize: 13 }}>
                                            {g.emoji} {g.label}
                                        </button>
                                    ))}
                                </div>
                            </Field>

                            <TimeBlock emoji="🎮" title="Εργασία" color="#b09fff" bg="rgba(130,100,255,0.07)" border="rgba(130,100,255,0.2)" startVal={form.workStart} endVal={form.workEnd} onStart={v => setForm({...form, workStart:v})} onEnd={v => setForm({...form, workEnd:v})} />
                            
                            <TimeBlock emoji="🚗" title="Οδήγηση" color="#ffb347" bg="rgba(255,180,60,0.07)" border="rgba(255,180,60,0.2)" startVal={form.driveStart} endVal={form.driveEnd} onStart={v => setForm({...form, driveStart:v})} onEnd={v => setForm({...form, driveEnd:v})} hasDriving={form.hasDriving} onToggle={() => setForm({...form, hasDriving: !form.hasDriving})} />

                            <Field label="Αμοιβή (€)"><TxtInput type="number" value={form.pay} onChange={e => setForm({...form, pay: e.target.value})} /></Field>
                            
                            <button onClick={save} style={{ width: "100%", padding: 18, borderRadius: 16, background: "#8264ff", border: "none", color: "#fff", fontWeight: 700, marginTop: 20 }}>Αποθήκευση</button>
                        </div>
                    )}

                    {view === "detail" && selected && (
                        <div style={{ padding: 22 }}>
                            <button onClick={() => setView("list")} style={{ marginTop: 40, color: "#8264ff", background: "none", border: "none" }}>← Πίσω</button>
                            <h1 style={{ fontSize: 32, marginTop: 20 }}>📍 {selected.location}</h1>
                            <div style={{ fontSize: 48, fontWeight: 800, color: "#7dffb3", margin: "20px 0" }}>€{selected.pay}</div>
                            <div style={{ background: "rgba(255,255,255,0.05)", padding: 20, borderRadius: 20 }}>
                                <div style={{ marginBottom: 10 }}>🎮 Εργασία: {fmtH(selected.workH)}</div>
                                {selected.hasDriving && <div>🚗 Οδήγηση: {fmtH(selected.driveH)}</div>}
                            </div>
                            <button onClick={() => { setShifts(shifts.filter(x => x.id !== selected.id)); setView("list"); }} style={{ marginTop: 40, color: "#ff6b80", background: "none", border: "none" }}>Διαγραφή βάρδιας</button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
