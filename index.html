<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shift Tracker</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #0c0c14; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; }
        input[type="time"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .35; }
        ::-webkit-scrollbar { display: none; }
        .fade-in { animation: fadeIn 0.2s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const STORAGE_KEY = "nerf_shifts_v3";

        const blank = () => ({
            date: new Date().toISOString().slice(0, 10),
            location: "", workStart: "", workEnd: "",
            hasDriving: false, driveDuration: "", tips: "", pay: "",
        });

        const mins = t => { if (!t) return 0; const [h, m] = t.split(":").map(Number); return h * 60 + m; };
        const diffH = (a, b) => {
            if (!a || !b) return 0;
            const d = mins(b) >= mins(a) ? mins(b) - mins(a) : 1440 - mins(a) + mins(b);
            return +(d / 60).toFixed(2);
        };
        const fmtH = h => {
            const hr = Math.floor(h), mn = Math.round((h - hr) * 60);
            return mn > 0 ? `${hr}ω ${mn}λ` : `${hr}ω`;
        };

        function App() {
            const [shifts, setShifts] = useState(() => JSON.parse(localStorage.getItem(STORAGE_KEY)) || []);
            const [view, setView] = useState("list");
            const [tab, setTab] = useState("shifts");
            const [form, setForm] = useState(blank());
            const [selected, setSelected] = useState(null);

            useEffect(() => { localStorage.setItem(STORAGE_KEY, JSON.stringify(shifts)); }, [shifts]);

            const totPay = shifts.reduce((a, s) => a + (parseFloat(s.pay) || 0), 0);
            const totTips = shifts.reduce((a, s) => a + (parseFloat(s.tips) || 0), 0);
            const totWork = shifts.reduce((a, s) => a + (parseFloat(s.workH) || 0), 0);
            const totDrive = shifts.reduce((a, s) => a + (parseFloat(s.driveDuration) || 0), 0);

            const save = () => {
                const workH = diffH(form.workStart, form.workEnd);
                const entry = { ...form, id: Date.now(), workH };
                setShifts([entry, ...shifts]);
                setView("list");
            };

            return (
                <div className="max-w-md mx-auto min-h-screen text-white p-6 relative pb-24">
                    {view === "list" && (
                        <div className="fade-in">
                            <h1 className="text-3xl font-bold mt-10 mb-6 italic">Shift Log</h1>
                            
                            <div className="grid grid-cols-2 gap-3 mb-6">
                                <div className="bg-white/5 border border-white/10 p-4 rounded-2xl">
                                    <div className="text-[10px] text-white/30 uppercase font-bold">Σύνολο (+Tips)</div>
                                    <div className="text-2xl font-black text-green-400">€{(totPay + totTips).toFixed(0)}</div>
                                </div>
                                <div className="bg-white/5 border border-white/10 p-4 rounded-2xl">
                                    <div className="text-[10px] text-white/30 uppercase font-bold">Μόνο Tips</div>
                                    <div className="text-2xl font-black text-yellow-400">€{totTips.toFixed(0)}</div>
                                </div>
                            </div>

                            <div className="flex bg-white/5 p-1 rounded-xl mb-6">
                                <button onClick={() => setTab("shifts")} className={`flex-1 py-2 rounded-lg text-sm font-bold ${tab === "shifts" ? 'bg-white/10 text-white' : 'text-white/40'}`}>ΒΑΡΔΙΕΣ</button>
                                <button onClick={() => setTab("stats")} className={`flex-1 py-2 rounded-lg text-sm font-bold ${tab === "stats" ? 'bg-white/10 text-white' : 'text-white/40'}`}>STATS</button>
                            </div>

                            {tab === "shifts" ? (
                                <div className="space-y-3">
                                    {shifts.map(s => (
                                        <div key={s.id} onClick={() => { setSelected(s); setView("detail"); }} className="bg-white/5 border border-white/10 p-5 rounded-3xl">
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <div className="font-bold text-lg">📍 {s.location}</div>
                                                    <div className="text-xs text-white/30">{s.date}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-xl font-black text-green-400">€{parseFloat(s.pay) + (parseFloat(s.tips) || 0)}</div>
                                                    {s.tips > 0 && <div className="text-[10px] text-yellow-500">incl. €{s.tips} tips</div>}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <div className="space-y-4 fade-in">
                                    <div className="bg-purple-600/10 border border-purple-500/20 p-6 rounded-3xl">
                                        <div className="text-sm text-purple-400 mb-1 font-bold">Συνολικές Ώρες</div>
                                        <div className="text-4xl font-black">{fmtH(totWork + totDrive)}</div>
                                        <div className="text-xs text-white/40 mt-2">Εργασία: {fmtH(totWork)} | Οδήγηση: {fmtH(totDrive)}</div>
                                    </div>
                                    <div className="bg-white/5 border border-white/10 p-6 rounded-3xl">
                                        <div className="flex justify-between mb-4 pb-4 border-b border-white/5">
                                            <span className="text-white/40">Βάρδιες</span>
                                            <span className="font-bold">{shifts.length}</span>
                                        </div>
                                        <div className="flex justify-between">
                                            <span className="text-white/40">Μέσος Όρος / Βάρδια</span>
                                            <span className="font-bold text-green-400">€{shifts.length ? ((totPay + totTips)/shifts.length).toFixed(1) : 0}</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            <button onClick={() => { setForm(blank()); setView("add"); }} className="fixed bottom-8 right-6 w-16 h-16 rounded-full bg-purple-600 text-3xl shadow-2xl font-bold">+</button>
                        </div>
                    )}

                    {view === "add" && (
                        <div className="fade-in">
                            <div className="flex justify-between items-center mt-10 mb-8">
                                <button onClick={() => setView("list")} className="text-purple-500 font-bold text-sm">ΑΚΥΡΟ</button>
                                <h2 className="text-xl font-black uppercase tracking-widest">Νέα Βάρδια</h2>
                                <button onClick={save} className="bg-purple-600 px-4 py-2 rounded-xl font-bold text-sm">ΤΕΛΟΣ</button>
                            </div>
                            
                            <div className="space-y-4">
                                <input type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-white" />
                                <input placeholder="Τοποθεσία" value={form.location} onChange={e => setForm({...form, location: e.target.value})} className="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-white" />
                                
                                <div className="bg-white/5 border border-white/10 rounded-3xl p-5">
                                    <div className="text-[10px] text-white/30 font-bold uppercase mb-4">Ωράριο Εργασίας</div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <input type="time" value={form.workStart} onChange={e => setForm({...form, workStart: e.target.value})} className="bg-black/40 p-3 rounded-xl border border-white/10" />
                                        <input type="time" value={form.workEnd} onChange={e => setForm({...form, workEnd: e.target.value})} className="bg-black/40 p-3 rounded-xl border border-white/10" />
                                    </div>
                                </div>

                                <div className="bg-orange-500/5 border border-orange-500/20 rounded-3xl p-5">
                                    <div className="flex justify-between items-center mb-4">
                                        <span className="text-orange-400 font-bold text-sm uppercase">Οδήγηση</span>
                                        <button onClick={() => setForm({...form, hasDriving: !form.hasDriving})} className={`px-4 py-1 rounded-full text-xs font-bold ${form.hasDriving ? 'bg-orange-500 text-black' : 'bg-white/5 text-white/40'}`}>
                                            {form.hasDriving ? 'ΝΑΙ' : 'ΟΧΙ'}
                                        </button>
                                    </div>
                                    {form.hasDriving && (
                                        <input type="number" step="0.5" placeholder="Πόσες ώρες; (π.χ. 1.5)" value={form.driveDuration} onChange={e => setForm({...form, driveDuration: e.target.value})} className="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white" />
                                    )}
                                </div>

                                <div className="grid grid-cols-2 gap-4">
                                    <div className="bg-white/5 border border-white/10 rounded-3xl p-4">
                                        <div className="text-[10px] text-white/30 font-bold uppercase mb-2">Βασική (€)</div>
                                        <input type="number" value={form.pay} onChange={e => setForm({...form, pay: e.target.value})} className="w-full bg-transparent text-xl font-bold outline-none" />
                                    </div>
                                    <div className="bg-yellow-500/5 border border-yellow-500/20 rounded-3xl p-4">
                                        <div className="text-[10px] text-yellow-500/50 font-bold uppercase mb-2">Tips (€)</div>
                                        <input type="number" value={form.tips} onChange={e => setForm({...form, tips: e.target.value})} className="w-full bg-transparent text-xl font-bold text-yellow-400 outline-none" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {view === "detail" && selected && (
                        <div className="fade-in">
                            <button onClick={() => setView("list")} className="text-purple-500 font-bold mt-10 mb-6">← ΠΙΣΩ</button>
                            <div className="bg-white/5 border border-white/10 p-8 rounded-[40px] relative overflow-hidden">
                                <div className="text-white/40 text-sm mb-2">{selected.date}</div>
                                <h1 className="text-3xl font-black mb-4 italic uppercase">{selected.location}</h1>
                                <div className="text-6xl font-black text-green-400 mb-2">€{parseFloat(selected.pay) + (parseFloat(selected.tips) || 0)}</div>
                                {selected.tips > 0 && <div className="text-yellow-500 font-bold mb-8">περιλαμβάνει €{selected.tips} tips</div>}
                                
                                <div className="grid grid-cols-2 gap-3 text-left">
                                    <div className="bg-white/5 p-4 rounded-2xl">
                                        <div className="text-[10px] text-white/30 uppercase font-bold">Εργασία</div>
                                        <div className="text-lg font-bold">{fmtH(selected.workH)}</div>
                                    </div>
                                    <div className="bg-white/5 p-4 rounded-2xl">
                                        <div className="text-[10px] text-white/30 uppercase font-bold">Οδήγηση</div>
                                        <div className="text-lg font-bold">{selected.driveDuration || 0}ω</div>
                                    </div>
                                </div>
                                <button onClick={() => { setShifts(shifts.filter(x => x.id !== selected.id)); setView("list"); }} className="mt-10 text-red-500/30 text-xs font-bold uppercase tracking-tighter">Διαγραφή Βάρδιας</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
